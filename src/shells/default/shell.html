<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link href="/assets/styles.css" rel="stylesheet" />
    <title>Mast</title>
</head>
<body>
    <div id="mainarea" class="">
        <div id="headerdiv">
            <header class="h-16">
                <div class="max-lg:collapse bg-base-200 lg:mb-48 shadow-sm w-full rounded-md">
                  <input id="navbar-1-toggle" class="peer hidden" type="checkbox" />
                  <label for="navbar-1-toggle" class="fixed inset-0 hidden max-lg:peer-checked:block"></label>
                  <div class="collapse-title navbar">
                    <div class="navbar-start">
                      <label for="navbar-1-toggle" class="btn btn-ghost lg:hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /></svg>
                      </label>
                      <button class="btn btn-ghost text-xl">Mast</button>
                    </div>
                    <div class="navbar-center hidden lg:flex">
                      <ul class="menu menu-horizontal px-1">
                        <li><button>Item 1</button></li>
                        <li>
                          <details>
                            <summary>Parent</summary>
                            <ul class="p-2 bg-base-100 w-40 z-1">
                              <li><button>Submenu 1</button></li>
                              <li><button>Submenu 2</button></li>
                            </ul>
                          </details>
                        </li>
                        <li><button>Item 3</button></li>
                      </ul>
                    </div>
                    <div class="navbar-end">
                      <input type="text" placeholder="Search" class="input input-bordered w-64 lg:w-auto" />
                    </div>
                  </div>

                  <div class="collapse-content lg:hidden z-1">
                    <ul class="menu">
                      <li><button>Item 1</button></li>
                      <li>
                        <button>Parent</button>
                        <ul>
                          <li><button>Submenu 1</button></li>
                          <li><button>Submenu 2</button></li>
                        </ul>
                      </li>
                      <li><button>Item 3</button></li>
                    </ul>
                  </div>
                </div>
            </header>
        </div>

        <div id="contentdiv" class="flex w-full justify-center caret-amber-500">
            <main class="w-full mx-auto p-4">
                <div id="mast-content" class="flex justify-center">
                    <article class="prose">
                        <!--MAST-CONTENT-->
                    </article>
                </div>
                <div id="toc">
                    <!--MAST-TOC-->
                </div>
            </main>
        </div>
    </div>
    <script>
        // Header: fetch /api/config, set wiki name, check auth
        fetch('/api/config').then(r => r.json()).then(cfg => {
            document.getElementById('wiki-name').textContent = cfg.basic.name
        })
        // Auth: fetch /api/auth/me, update auth link
        fetch('/api/auth/me').then(r => {
            if (r.ok) {
                document.getElementById('auth-link').textContent = 'Account'
                document.getElementById('auth-link').href = '/admin/account'
            }
        })
        // Sidebar: fetch /api/routes, build tree
        fetch('/api/routes').then(r => r.json()).then(routes => {
            // build nested <li> tree from flat slug list
        })
    </script>
</body>
</html>
