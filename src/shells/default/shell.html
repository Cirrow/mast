<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link href="/assets/styles.css" rel="stylesheet" />
    <title>Mast</title>
</head>
<body>
    <div id="mainarea" class="">
        <div id="headerdiv">
            <header class="h-16">
                <label class="toggle text-base-content">
                  <input type="checkbox" value="synthwave" class="theme-controller" />

                  <svg aria-label="sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" class="size-5"><g stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></g></svg>
                  <svg aria-label="moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" class="size-5"><g stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></g></svg>

                </label>
            </header>
        </div>

        <div id="contentdiv" class="flex w-full justify-center caret-amber-500">
            <main class="p-4">
                <div id="mast-content">
                    <article class="prose">
                        <!--MAST-CONTENT-->
                    </article>
                </div>
            </main>
        </div>
    </div>
    <script>
        // Header: fetch /api/config, set wiki name, check auth
        fetch('/api/config').then(r => r.json()).then(cfg => {
            document.getElementById('wiki-name').textContent = cfg.basic.name
        })
        // Auth: fetch /api/auth/me, update auth link
        fetch('/api/auth/me').then(r => {
            if (r.ok) {
                document.getElementById('auth-link').textContent = 'Account'
                document.getElementById('auth-link').href = '/admin/account'
            }
        })
        // Sidebar: fetch /api/routes, build tree
        fetch('/api/routes').then(r => r.json()).then(routes => {
            // build nested <li> tree from flat slug list
        })
    </script>
</body>
</html>
