<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link href="/assets/styles.css" rel="stylesheet" />
    <title>Mast</title>
</head>
<body>
    <div id="mainarea" class="">
        <div id="contentdiv" class="flex justify-center caret-amber-500">
            <main class="p-4">
                <div id="mast-content"><!--MAST-CONTENT--></div>
            </main>
        </div>
    </div>
    <script>
        // Header: fetch /api/config, set wiki name, check auth
        fetch('/api/config').then(r => r.json()).then(cfg => {
            document.getElementById('wiki-name').textContent = cfg.basic.name
        })
        // Auth: fetch /api/auth/me, update auth link
        fetch('/api/auth/me').then(r => {
            if (r.ok) {
                document.getElementById('auth-link').textContent = 'Account'
                document.getElementById('auth-link').href = '/admin/account'
            }
        })
        // Sidebar: fetch /api/routes, build tree
        fetch('/api/routes').then(r => r.json()).then(routes => {
            // build nested <li> tree from flat slug list
        })
    </script>
</body>
</html>
