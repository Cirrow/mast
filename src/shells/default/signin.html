<h1>Log in</h1>
<div class="flex flex-col items-center">

    <form id="signin-form" class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
        <fieldset class="fieldset">
            <label class="label">Username or email</label>
            <input id="signin-user" type="text" class="input validator" placeholder="Username or email" required autocomplete="username" />
            <span class="validator-hint hidden">Required</span>
        </fieldset>

        <label class="fieldset">
            <label class="label">Password</label>
            <input id="signin-pass" type="password" class="input validator" placeholder="Password" required autocomplete="current-password" />
            <span class="validator-hint hidden">Required</span>
        </label>

        <button class="btn btn-neutral mt-4" type="submit">Login</button>
        <button class="btn btn-ghost mt-1" type="reset">Reset</button>
    </form>

    <div id="signin-error" class="mt-4 alert alert-error mb-4 hidden"></div>

</div>

<script>
    const form = document.getElementById('signin-form')
    const errorEl = document.getElementById('signin-error')

    const showError = (msg) => {
        errorEl.textContent = msg
        errorEl.classList.remove('hidden')
    }

    fetch('/api/auth/config')
        .then(r => {
            if (!r.ok) throw new Error('config unavailable')
            return r.json()
        })
    .then(cfg => {
      if (!(cfg.auth_methods || []).includes('username')) {
            form.classList.add('hidden')
            showError('No login method is configured.')
        }
    })
    .catch(() => {})

    form.addEventListener('submit', e => {
        e.preventDefault()
        const username = document.getElementById('signin-user').value
        const password = document.getElementById('signin-pass').value
        errorEl.classList.add('hidden')

        fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        }).then(async r => {
        if (r.ok) {
            window.location.href = '/wiki/home'
        } else {
            const err = await r.json().catch(() => ({}))
            showError(err.error || 'Invalid credentials')
        }
        }).catch(() => showError('Network error'))
    })
</script>
