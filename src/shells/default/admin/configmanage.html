<h1>Configuration Manager</h1>
<p><a href="/admin">← Return to admin page</a></p>

<p>This is the configuration manager for the wiki. Make sure to click SAVE at the bottom so your changes are saved. You can hover over each fields to get a </p>

<form method="POST" action="/admin/configmanage" id="config-form">

    <div class="divider"><h2 class="not-prose">BASIC</h2></div>
    <fieldset class="fieldset bg-base-200 border-base-300 rounded-box border p-4">
        <div class="card-body grid grid-cols-3 gap-3">
            <!--MAST_FIELDS:basic-->
        </div>
    </fieldset>

    <div class="divider mt-20"><h2 class="not-prose">AUTHENTICATION</h2></div>
    <fieldset class="fieldset bg-base-200 border-base-300 rounded-box border p-4">
        <div class="card-body">
            <!--MAST_FIELDS:auth-->
        </div>
    </fieldset>

    <div class="divider mt-20"><h2 class="not-prose">STORAGE</h2></div>
    <fieldset class="fieldset bg-base-200 border-base-300 rounded-box border p-4">
        <div class="card-body">
            <!--MAST_FIELDS:storage-->
        </div>
    </fieldset>

    <div class="divider mt-20"><h2 class="not-prose">SHELL</h2></div>
    <fieldset class="fieldset bg-base-200 border-base-300 rounded-box border p-4">
        <div class="card-body">
            <!--MAST_FIELDS:shell-->
        </div>
    </fieldset>

    <hr />

    <div class="flex justify-end gap-2 mt-4">
        <a href="/admin" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">Save</button>
    </div>
</form>

<div id="unsaved-toast" class="toast toast-start hidden bg-black rounded-md p-4 w-sm">
    <span class="text-white"><span class="icon-[clarity--warning-line]"></span>Warning: unsaved changes</span>
    <button id="scroll-bottom-btn" class="btn btn-sm btn-outline bg-white">Scroll to save</button>
</div>

<script>
const form = document.getElementById('config-form');
const toast = document.getElementById('unsaved-toast');
const scrollBtn = document.getElementById('scroll-bottom-btn');

const initialState = new URLSearchParams(new FormData(form)).toString();

function checkDirty() {
  const currentState = new URLSearchParams(new FormData(form)).toString();
  toast.classList.toggle('hidden', currentState === initialState);
}

form.addEventListener('input', checkDirty);
form.addEventListener('change', checkDirty);
form.addEventListener('submit', () => toast.classList.add('hidden'));

scrollBtn.addEventListener('click', () => {
    window.scrollTo(0, document.body.scrollHeight);
});
</script>
